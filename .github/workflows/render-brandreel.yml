name: Render Brand Reel

on:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------
  # Single job — BrandReel is one composition (no scene matrix, no
  # concat/mux step): 50s, 3000f, silent.
  # ---------------------------------------------------------------------
  render:
    name: Render BrandReel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Chrome for Remotion
        run: npx remotion browser ensure

      - name: Render BrandReel
        run: |
          mkdir -p out
          npx remotion render src/index.ts BrandReel \
            out/wall-decores-brand-reel.mp4 \
            --codec h264 \
            --crf 18 \
            --pixel-format yuv420p \
            --muted \
            --log verbose

      - uses: actions/upload-artifact@v4
        with:
          name: brand-reel
          path: out/wall-decores-brand-reel.mp4
          retention-days: 30
