name: Generate voiceover (Kokoro-82M)

on:
  workflow_dispatch:
    inputs:
      script_file:
        description: Path to the script text file (repo-relative)
        required: true
      voice:
        description: Kokoro voice id (e.g. af_heart, af_bella, bf_emma, bm_george)
        required: false
        default: af_heart
      voice2:
        description: Optional second voice to blend in (leave blank for a single voice)
        required: false
        default: ""
      blend:
        description: Blend weight for voice2 (0 = all voice, 1 = all voice2)
        required: false
        default: "0.5"
      speed:
        description: Speaking speed
        required: false
        default: "0.94"
      preset:
        description: Mastering preset (natural, warm, bright, broadcast)
        required: false
        default: natural
      out_path:
        description: Output WAV path (repo-relative)
        required: false
        default: public/audio/voiceover.wav

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      # ffmpeg ships preinstalled on ubuntu-latest runners — the mastering
      # pass (and voice blending, when voice2 is set) in generate.mjs needs
      # it on PATH, nothing to install here.
      - name: Generate voiceover (mastered + raw)
        id: generate
        run: |
          ARGS=(--file "${{ inputs.script_file }}" --voice "${{ inputs.voice }}" \
                --speed "${{ inputs.speed }}" --preset "${{ inputs.preset }}" \
                --out "${{ inputs.out_path }}")
          if [ -n "${{ inputs.voice2 }}" ]; then
            ARGS+=(--voice2 "${{ inputs.voice2 }}" --blend "${{ inputs.blend }}")
          fi
          node scripts/voiceover/generate.mjs "${ARGS[@]}"
          echo "raw_path=$(echo '${{ inputs.out_path }}' | sed 's/\.wav$/.raw.wav/')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: voiceover-wav
          path: |
            ${{ inputs.out_path }}
            ${{ steps.generate.outputs.raw_path }}
          retention-days: 7
