name: Render via Lambda

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Composition to render
        required: true
        default: MilitaryDiorama
        type: string

jobs:
  render:
    name: Render ${{ github.event.inputs.composition }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws configure set region ${{ secrets.AWS_REGION }}

      - name: Render on Lambda
        run: |
          mkdir -p out
          npx remotion lambda render \
            ${{ secrets.REMOTION_SITE_NAME }} \
            ${{ github.event.inputs.composition }} \
            --region=${{ secrets.AWS_REGION }} \
            --out=out/${{ github.event.inputs.composition }}.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-render-${{ github.event.inputs.composition }}
          path: out/${{ github.event.inputs.composition }}.mp4
          retention-days: 30
