name: Render TestRoomCinematic30

on:
  workflow_dispatch:
    inputs:
      quality:
        description: Quality prop to pass to the composition
        required: false
        default: full
        type: string

jobs:
  render:
    name: Render TestRoomCinematic30 (${{ github.event.inputs.quality }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Chrome for Remotion
        run: npx remotion browser ensure

      - name: Render TestRoomCinematic30
        run: |
          mkdir -p out
          npx remotion render src/index.ts TestRoomCinematic30 \
            out/TestRoomCinematic30.mp4 \
            --props='{"quality":"${{ github.event.inputs.quality }}"}' \
            --gl=angle \
            --codec h264 \
            --crf 18 \
            --log verbose

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verify frame count and duration
        run: |
          ffprobe -hide_banner -v error \
            -select_streams v:0 \
            -show_entries stream=nb_frames,width,height,r_frame_rate,codec_name \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            out/TestRoomCinematic30.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/TestRoomCinematic30.mp4
          retention-days: 30
