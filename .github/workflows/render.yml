name: Render Brand Film

on:
  workflow_dispatch:
    inputs:
      composition:
        description: "Render a single composition instead of the full film (leave blank for all shots)"
        required: false
        default: ""

jobs:
  # ---------------------------------------------------------------------
  # One machine per shot. Public-repo runners give 4 CPU / 16 GB each,
  # free and unmetered, so six shots cost the same wall-clock time as one.
  # ---------------------------------------------------------------------
  render-shot:
    name: Render ${{ matrix.shot.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shot:
          - { n: "01", id: "Shot1" }
          - { n: "02", id: "Shot2" }
          - { n: "03", id: "Shot3" }
          - { n: "04", id: "Shot4" }
          - { n: "05", id: "Shot5" }
          - { n: "06", id: "Shot6" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Chrome for Remotion
        run: npx remotion browser ensure

      # --muted matters more than it looks. Without it Remotion attaches a
      # silent AAC track that runs ~0.056s longer than the video, and six of
      # those concatenated drift by a third of a second and throw timestamp
      # warnings. Video-only files concat cleanly; music is laid over the
      # finished film in one pass at the end.
      - name: Render ${{ matrix.shot.id }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts ${{ matrix.shot.id }} \
            out/${{ matrix.shot.n }}-${{ matrix.shot.id }}.mp4 \
            --codec h264 \
            --crf 18 \
            --x264-preset veryfast \
            --pixel-format yuv420p \
            --muted \
            --log verbose

      - name: Verify frame count and duration
        run: |
          ffprobe -hide_banner -v error \
            -select_streams v:0 \
            -show_entries stream=nb_frames,width,height,r_frame_rate \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            out/${{ matrix.shot.n }}-${{ matrix.shot.id }}.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: shot-${{ matrix.shot.n }}
          path: out/${{ matrix.shot.n }}-${{ matrix.shot.id }}.mp4
          retention-days: 7

  # ---------------------------------------------------------------------
  # Join the six files. `-c copy` stitches the existing streams without
  # re-encoding, so the final film is bit-identical to what each machine
  # produced. Re-encoding here would cost a generation of quality for
  # nothing.
  # ---------------------------------------------------------------------
  concat:
    name: Join shots into final film
    needs: render-shot
    runs-on: ubuntu-latest
    steps:
      - name: Download all shots
        uses: actions/download-artifact@v4
        with:
          path: shots
          pattern: shot-*
          merge-multiple: true

      - name: Build concat list in shot order
        run: |
          mkdir -p out
          ls -1 shots
          for f in $(ls -1 shots/*.mp4 | sort); do
            echo "file '$PWD/$f'" >> list.txt
          done
          echo "--- concat list ---"
          cat list.txt

      - name: Join without re-encoding
        run: |
          ffmpeg -hide_banner -f concat -safe 0 -i list.txt \
            -c copy -movflags +faststart \
            out/wall-decores-brand-film.mp4

      - name: Report
        run: |
          ffprobe -hide_banner -v error \
            -show_entries format=duration,size \
            -show_entries stream=width,height,r_frame_rate,codec_name \
            -of default=noprint_wrappers=1 \
            out/wall-decores-brand-film.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: out/wall-decores-brand-film.mp4
          retention-days: 30
