name: Render Vector Film
on:
  workflow_dispatch:
jobs:
  render:
    name: Render VectorFilm
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install
      - name: Install Chrome for Remotion
        run: npx remotion browser ensure
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Render VectorFilm
        run: |
          mkdir -p out
          npx remotion render src/index.ts VectorFilm out/wall-decores-vector-film.mp4 --codec h264 --crf 18 --pixel-format yuv420p --muted --log verbose
      - uses: actions/upload-artifact@v4
        with:
          name: vector-film
          path: out/wall-decores-vector-film.mp4
          retention-days: 30
